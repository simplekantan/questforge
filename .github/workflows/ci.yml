name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout questforge
        uses: actions/checkout@v4
        with:
          path: questforge

      - name: Checkout questforge-tools (QuestForge.Predicates dependency)
        uses: actions/checkout@v4
        with:
          repository: simplekantan/questforge-tools
          path: questforge-tools

      - name: Checkout questforge-data (fixture regression tests)
        uses: actions/checkout@v4
        with:
          repository: simplekantan/questforge-data
          path: questforge-data

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run engine tests
        working-directory: questforge
        run: dotnet test QuestForge.Engine.Tests/QuestForge.Engine.Tests.csproj --configuration Release
