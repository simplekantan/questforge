name: CI

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  pull_request:
    branches: [main]

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout questforge
        uses: actions/checkout@v4
        with:
          path: questforge

      - name: Checkout questforge-tools (QuestForge.Predicates dependency)
        uses: actions/checkout@v4
        with:
          repository: simplekantan/questforge-tools
          path: questforge-tools

      - name: Checkout questforge-data (fixture regression tests)
        uses: actions/checkout@v4
        with:
          repository: simplekantan/questforge-data
          path: questforge-data

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Remove Dalamud NuGet feed
        # dalamud.dev is unavailable in GitHub Actions and NU1801 is treated as
        # an error in some projects. Replace the repo NuGet.Config with a CI-only
        # version that only includes nuget.org (engine tests need no Dalamud packages).
        run: |
          cat > questforge/NuGet.Config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF

      - name: Run engine tests
        working-directory: questforge
        run: dotnet test QuestForge.Engine.Tests/QuestForge.Engine.Tests.csproj --configuration Release
